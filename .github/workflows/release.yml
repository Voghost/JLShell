name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '0.1.0'
      channel:
        description: 'Release channel for website update API'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
      publish:
        description: 'Publish release on website immediately'
        required: true
        default: false
        type: boolean
      asset_visible:
        description: 'Make uploaded OSS assets visible on public website APIs'
        required: true
        default: false
        type: boolean
      upload_to_oss:
        description: 'Upload release assets to Aliyun OSS from GitHub Actions'
        required: true
        default: true
        type: boolean
      notify_website:
        description: 'Notify jlshell.oomn.net after OSS upload'
        required: true
        default: true
        type: boolean

env:
  VERSION: ${{ github.event.inputs.version }}
  RELEASE_CHANNEL: ${{ github.event.inputs.channel }}
  RELEASE_PUBLISH: ${{ github.event.inputs.publish }}
  RELEASE_ASSET_VISIBLE: ${{ github.event.inputs.asset_visible }}
  MODULES: "java.base,java.compiler,java.datatransfer,java.desktop,java.instrument,java.logging,java.management,java.management.rmi,java.naming,java.net.http,java.prefs,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.transaction.xa,java.xml,java.xml.crypto,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.httpserver,jdk.jfr,jdk.localedata,jdk.management,jdk.naming.dns,jdk.net,jdk.unsupported,jdk.unsupported.desktop,jdk.zipfs,javafx.base,javafx.controls,javafx.fxml,javafx.graphics,javafx.swing"

jobs:
  # ── macOS ───────────────────────────────────────────────────────────────────
  build-mac:
    name: Build macOS (arm64 + x64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: 'jdk+fx'
          cache: maven

      - name: Set version from input
        run: mvn versions:set -DnewVersion=${VERSION} -q

      - name: Build
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          mvn package -DskipTests -pl launcher,app -am -q

          # Discover the built jar dynamically (no hardcoded version)
          JAR=$(ls app/target/jlshell-app-*.jar | head -1)
          LAUNCHER_JAR=$(ls launcher/target/jlshell-launcher-*.jar | head -1)
          echo "JAR=$JAR" >> $GITHUB_ENV
          echo "LAUNCHER_JAR=$LAUNCHER_JAR" >> $GITHUB_ENV

          JDK=$JAVA_HOME

          # jlink a custom JRE
          $JDK/bin/jlink \
            --module-path $JDK/jmods \
            --add-modules $MODULES \
            --output dist/jre \
            --strip-debug --no-man-pages --no-header-files --compress zip-6

          # Build AppIcon.icns (needed by jpackage)
          ICON_PNG=app/src/main/resources/icons/app_icon.png
          ICONSET=dist/AppIcon.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z $size $size "$ICON_PNG" --out "$ICONSET/icon_${size}x${size}.png" &>/dev/null
            sips -z $((size*2)) $((size*2)) "$ICON_PNG" --out "$ICONSET/icon_${size}x${size}@2x.png" &>/dev/null
          done
          iconutil -c icns "$ICONSET" -o dist/AppIcon.icns
          rm -rf "$ICONSET"

          # Use jpackage to create a proper .app bundle with a native launcher.
          # The native launcher sets the process name to "JLShell", so macOS shows
          # "Hide JLShell" / "Quit JLShell" instead of the Java class name.
          PKG_VERSION="${VERSION#0.}"
          PKG_VERSION="1.${PKG_VERSION}"

          mkdir -p dist/input
          mkdir -p dist/input/app
          cp "$LAUNCHER_JAR" dist/input/jlshell-launcher.jar
          cp "$JAR" dist/input/app/jlshell-app-bundled.jar

          $JDK/bin/jpackage \
            --type app-image \
            --name JLShell \
            --app-version "$PKG_VERSION" \
            --input dist/input \
            --main-jar jlshell-launcher.jar \
            --main-class com.jlshell.launcher.BootstrapLauncher \
            --runtime-image dist/jre \
            --icon dist/AppIcon.icns \
            --vendor JLShell \
            --description "JLShell SSH Client" \
            --java-options "-Xms64m" \
            --java-options "-Xmx512m" \
            --java-options "-XX:+ExplicitGCInvokesConcurrent" \
            --java-options "--add-opens java.base/java.lang=ALL-UNNAMED" \
            --java-options "--add-opens java.desktop/sun.awt=ALL-UNNAMED" \
            --java-options "-Dapple.laf.useScreenMenuBar=true" \
            --java-options "-Dapple.awt.application.appearance=system" \
            --java-options "-Dapple.awt.application.name=JLShell" \
            --dest dist/mac-work

          # Localize the macOS application menu metadata used by AppKit.
          # JavaFX owns most menu wiring, but these bundle resources allow
          # system-generated app-menu labels to follow macOS language fallback.
          /usr/libexec/PlistBuddy -c "Delete :NSRequiresAquaSystemAppearance" \
            dist/mac-work/JLShell.app/Contents/Info.plist >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :NSRequiresAquaSystemAppearance bool false" \
            dist/mac-work/JLShell.app/Contents/Info.plist
          mkdir -p dist/mac-work/JLShell.app/Contents/Resources/zh-Hans.lproj
          cat > dist/mac-work/JLShell.app/Contents/Resources/zh-Hans.lproj/InfoPlist.strings <<'EOF'
          "CFBundleDisplayName" = "JLShell";
          "CFBundleName" = "JLShell";
          "NSHumanReadableCopyright" = "版权所有";
          EOF

          APP_BUNDLE="dist/mac-work/JLShell.app"
          SIGN_IDENTITY="-"
          SIGNING_KEYCHAIN=""

          if [[ -n "${MACOS_CERTIFICATE_BASE64:-}" ]]; then
            echo "Importing Developer ID certificate for macOS signing..."
            CERT_PATH="$RUNNER_TEMP/jlshell-macos-certificate.p12"
            SIGNING_KEYCHAIN="$RUNNER_TEMP/jlshell-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(uuidgen)"
            printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
            security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
            security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$SIGNING_KEYCHAIN"
            security list-keychain -d user -s "$SIGNING_KEYCHAIN" $(security list-keychains -d user | sed 's/[ "]//g')
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
            SIGN_IDENTITY="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" \
              | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' \
              | head -1)"
            if [[ -z "$SIGN_IDENTITY" ]]; then
              echo "Developer ID Application identity was not found in imported certificate." >&2
              exit 1
            fi
            echo "Signing with identity: $SIGN_IDENTITY"
            codesign --force --deep --options runtime --timestamp --sign "$SIGN_IDENTITY" "$APP_BUNDLE"
          else
            echo "No Developer ID certificate configured; applying ad-hoc signature for bundle integrity."
            codesign --force --deep --sign - "$APP_BUNDLE"
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"

          if [[ "$SIGN_IDENTITY" != "-" ]]; then
            if [[ -n "${MACOS_NOTARIZATION_APPLE_ID:-}" && -n "${MACOS_NOTARIZATION_PASSWORD:-}" && -n "${MACOS_NOTARIZATION_TEAM_ID:-}" ]]; then
              echo "Submitting macOS app for notarization..."
              ditto -c -k --keepParent "$APP_BUNDLE" dist/JLShell-${VERSION}-mac-notary.zip
              xcrun notarytool submit dist/JLShell-${VERSION}-mac-notary.zip \
                --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
                --password "$MACOS_NOTARIZATION_PASSWORD" \
                --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
                --wait
              xcrun stapler staple "$APP_BUNDLE"
              xcrun stapler validate "$APP_BUNDLE"
              rm -f dist/JLShell-${VERSION}-mac-notary.zip
            else
              echo "::warning::Developer ID signing is enabled, but notarization secrets are incomplete. Gatekeeper may still block first launch."
            fi
          else
            echo "::warning::macOS app is ad-hoc signed only. Users may need to remove quarantine or use Open Anyway until Developer ID notarization is configured."
          fi

          ditto -c -k --keepParent "$APP_BUNDLE" dist/JLShell-${VERSION}-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac-package
          path: dist/JLShell-${{ env.VERSION }}-mac.zip

  # ── Linux ───────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (tar.gz + deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: 'jdk+fx'
          cache: maven

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y fakeroot dpkg-dev imagemagick

      - name: Set version from input
        run: mvn versions:set -DnewVersion=${VERSION} -q

      - name: Build fat jar + jlink runtime
        run: |
          mvn package -DskipTests -pl launcher,app -am -q

          # Discover the built jar dynamically (no hardcoded version)
          JAR=$(ls app/target/jlshell-app-*.jar | head -1)
          LAUNCHER_JAR=$(ls launcher/target/jlshell-launcher-*.jar | head -1)
          echo "JAR=$JAR" >> $GITHUB_ENV
          echo "LAUNCHER_JAR=$LAUNCHER_JAR" >> $GITHUB_ENV

          JDK=$JAVA_HOME
          mkdir -p dist
          $JDK/bin/jlink \
            --module-path $JDK/jmods \
            --add-modules $MODULES \
            --output dist/runtime \
            --strip-debug --no-man-pages --no-header-files --compress zip-6

          cp "$LAUNCHER_JAR" dist/jlshell-launcher.jar
          mkdir -p dist/app
          cp "$JAR" dist/app/jlshell-app-bundled.jar
          cp "$JAR" "dist/jlshell-app-${VERSION}.jar"

      # ── tar.gz ──────────────────────────────────────────────────────────────
      - name: Package tar.gz
        run: |
          mkdir -p dist/linux-work/JLShell
          cp -r dist/runtime dist/linux-work/JLShell/
          cp dist/jlshell-launcher.jar dist/linux-work/JLShell/
          cp -r dist/app dist/linux-work/JLShell/
          cat > dist/linux-work/JLShell/JLShell.vmoptions <<'EOF'
          # JLShell JVM options. One option per line.
          # User override path on Linux: ~/.config/jlshell/JLShell.vmoptions
          -Xms64m
          -Xmx512m
          -XX:+ExplicitGCInvokesConcurrent
          EOF

          cat > dist/linux-work/JLShell/JLShell.sh <<'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          DEFAULT_VM_OPTS=(-Xms64m -Xmx512m -XX:+ExplicitGCInvokesConcurrent)
          USER_VMOPTIONS="${XDG_CONFIG_HOME:-$HOME/.config}/jlshell/JLShell.vmoptions"
          BUNDLED_VMOPTIONS="$DIR/JLShell.vmoptions"
          VMOPTIONS_FILE=""
          if [[ -f "$USER_VMOPTIONS" ]]; then
            VMOPTIONS_FILE="$USER_VMOPTIONS"
          elif [[ -f "$BUNDLED_VMOPTIONS" ]]; then
            VMOPTIONS_FILE="$BUNDLED_VMOPTIONS"
          fi
          VM_OPTS=("${DEFAULT_VM_OPTS[@]}")
          if [[ -n "$VMOPTIONS_FILE" ]]; then
            CUSTOM_VM_OPTS=()
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%%#*}"
              line="$(echo "$line" | xargs)"
              [[ -z "$line" ]] && continue
              CUSTOM_VM_OPTS+=("$line")
            done < "$VMOPTIONS_FILE"
            if [[ ${#CUSTOM_VM_OPTS[@]} -gt 0 ]] && "$DIR/runtime/bin/java" "${CUSTOM_VM_OPTS[@]}" -version >/dev/null 2>&1; then
              VM_OPTS=("${CUSTOM_VM_OPTS[@]}")
            fi
          fi
          exec "$DIR/runtime/bin/java" "${VM_OPTS[@]}" \
            --add-opens java.base/java.lang=ALL-UNNAMED \
            --add-opens java.desktop/sun.awt=ALL-UNNAMED \
            -jar "$DIR/jlshell-launcher.jar" "$@"
          EOF
          chmod +x dist/linux-work/JLShell/JLShell.sh

          cd dist/linux-work && tar czf ../JLShell-${VERSION}-linux-x64.tar.gz JLShell

      # ── .deb ────────────────────────────────────────────────────────────────
      - name: Package .deb
        run: |
          PKG=dist/deb-work
          mkdir -p $PKG/opt/jlshell
          mkdir -p $PKG/usr/share/applications
          mkdir -p $PKG/usr/share/pixmaps
          mkdir -p $PKG/usr/bin
          mkdir -p $PKG/DEBIAN

          cp -r dist/runtime $PKG/opt/jlshell/
          cp dist/jlshell-launcher.jar $PKG/opt/jlshell/
          cp -r dist/app $PKG/opt/jlshell/
          cat > $PKG/opt/jlshell/JLShell.vmoptions <<'EOF'
          # JLShell JVM options. One option per line.
          # User override path on Linux: ~/.config/jlshell/JLShell.vmoptions
          -Xms64m
          -Xmx512m
          -XX:+ExplicitGCInvokesConcurrent
          EOF

          cat > $PKG/opt/jlshell/JLShell.sh <<'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          DEFAULT_VM_OPTS=(-Xms64m -Xmx512m -XX:+ExplicitGCInvokesConcurrent)
          USER_VMOPTIONS="${XDG_CONFIG_HOME:-$HOME/.config}/jlshell/JLShell.vmoptions"
          BUNDLED_VMOPTIONS="$DIR/JLShell.vmoptions"
          VMOPTIONS_FILE=""
          if [[ -f "$USER_VMOPTIONS" ]]; then
            VMOPTIONS_FILE="$USER_VMOPTIONS"
          elif [[ -f "$BUNDLED_VMOPTIONS" ]]; then
            VMOPTIONS_FILE="$BUNDLED_VMOPTIONS"
          fi
          VM_OPTS=("${DEFAULT_VM_OPTS[@]}")
          if [[ -n "$VMOPTIONS_FILE" ]]; then
            CUSTOM_VM_OPTS=()
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%%#*}"
              line="$(echo "$line" | xargs)"
              [[ -z "$line" ]] && continue
              CUSTOM_VM_OPTS+=("$line")
            done < "$VMOPTIONS_FILE"
            if [[ ${#CUSTOM_VM_OPTS[@]} -gt 0 ]] && "$DIR/runtime/bin/java" "${CUSTOM_VM_OPTS[@]}" -version >/dev/null 2>&1; then
              VM_OPTS=("${CUSTOM_VM_OPTS[@]}")
            fi
          fi
          exec "$DIR/runtime/bin/java" "${VM_OPTS[@]}" \
            --add-opens java.base/java.lang=ALL-UNNAMED \
            --add-opens java.desktop/sun.awt=ALL-UNNAMED \
            -jar "$DIR/jlshell-launcher.jar" "$@"
          EOF
          chmod +x $PKG/opt/jlshell/JLShell.sh

          # Symlink in /usr/bin
          ln -s /opt/jlshell/JLShell.sh $PKG/usr/bin/jlshell

          # .desktop
          cat > $PKG/usr/share/applications/jlshell.desktop <<EOF
          [Desktop Entry]
          Name=JLShell
          Comment=SSH Client
          Exec=/opt/jlshell/JLShell.sh
          Icon=jlshell
          Terminal=false
          Type=Application
          Categories=Network;System;
          EOF

          # Icon — use actual app icon from source (replace app_icon.png to customize)
          convert app/src/main/resources/icons/app_icon.png \
            -resize 64x64 $PKG/usr/share/pixmaps/jlshell.png

          # DEBIAN/control
          INSTALLED_SIZE=$(du -sk $PKG/opt/jlshell | cut -f1)
          cat > $PKG/DEBIAN/control <<EOF
          Package: jlshell
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: JLShell <noreply@jlshell.com>
          Installed-Size: ${INSTALLED_SIZE}
          Description: JLShell SSH Client
           A modern SSH client with SFTP browser and plugin support.
          Section: net
          Priority: optional
          EOF

          fakeroot dpkg-deb --build $PKG dist/JLShell-${VERSION}-linux-x64.deb

      # ── AppImage ─────────────────────────────────────────────────────────────
      - name: Package AppImage
        run: |
          # Download appimagetool and extract it (GitHub Actions runners lack FUSE)
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          /tmp/appimagetool.AppImage --appimage-extract 2>/dev/null
          APPIMAGETOOL="$(pwd)/squashfs-root/AppRun"

          APPDIR=dist/appimage-work/JLShell.AppDir
          mkdir -p $APPDIR/usr/{bin,lib,share/applications,share/pixmaps}

          cp -r dist/runtime $APPDIR/usr/
          cp dist/jlshell-launcher.jar $APPDIR/usr/
          cp -r dist/app $APPDIR/usr/
          cat > $APPDIR/usr/JLShell.vmoptions <<'EOF'
          # JLShell JVM options. One option per line.
          # User override path on Linux: ~/.config/jlshell/JLShell.vmoptions
          -Xms64m
          -Xmx512m
          -XX:+ExplicitGCInvokesConcurrent
          EOF

          # AppRun
          cat > $APPDIR/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(cd "$(dirname "$0")" && pwd)"
          DEFAULT_VM_OPTS=(-Xms64m -Xmx512m -XX:+ExplicitGCInvokesConcurrent)
          USER_VMOPTIONS="${XDG_CONFIG_HOME:-$HOME/.config}/jlshell/JLShell.vmoptions"
          BUNDLED_VMOPTIONS="$HERE/usr/JLShell.vmoptions"
          VMOPTIONS_FILE=""
          if [[ -f "$USER_VMOPTIONS" ]]; then
            VMOPTIONS_FILE="$USER_VMOPTIONS"
          elif [[ -f "$BUNDLED_VMOPTIONS" ]]; then
            VMOPTIONS_FILE="$BUNDLED_VMOPTIONS"
          fi
          VM_OPTS=("${DEFAULT_VM_OPTS[@]}")
          if [[ -n "$VMOPTIONS_FILE" ]]; then
            CUSTOM_VM_OPTS=()
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%%#*}"
              line="$(echo "$line" | xargs)"
              [[ -z "$line" ]] && continue
              CUSTOM_VM_OPTS+=("$line")
            done < "$VMOPTIONS_FILE"
            if [[ ${#CUSTOM_VM_OPTS[@]} -gt 0 ]] && "$HERE/usr/runtime/bin/java" "${CUSTOM_VM_OPTS[@]}" -version >/dev/null 2>&1; then
              VM_OPTS=("${CUSTOM_VM_OPTS[@]}")
            fi
          fi
          exec "$HERE/usr/runtime/bin/java" "${VM_OPTS[@]}" \
            --add-opens java.base/java.lang=ALL-UNNAMED \
            --add-opens java.desktop/sun.awt=ALL-UNNAMED \
            -jar "$HERE/usr/jlshell-launcher.jar" "$@"
          EOF
          chmod +x $APPDIR/AppRun

          # .desktop (required by AppImage)
          printf '[Desktop Entry]\nName=JLShell\nExec=AppRun\nIcon=jlshell\nType=Application\nCategories=Network;\n' > $APPDIR/jlshell.desktop

          # Icon (required by AppImage)
          cp dist/deb-work/usr/share/pixmaps/jlshell.png $APPDIR/jlshell.png

          ARCH=x86_64 "$APPIMAGETOOL" --no-appstream $APPDIR \
            dist/JLShell-${VERSION}-linux-x86_64.AppImage 2>&1

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/JLShell-${{ env.VERSION }}-linux-x64.tar.gz
            dist/JLShell-${{ env.VERSION }}-linux-x64.deb
            dist/JLShell-${{ env.VERSION }}-linux-x86_64.AppImage
            dist/jlshell-app-${{ env.VERSION }}.jar

  # ── Windows ─────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (zip + msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: 'jdk+fx'
          cache: maven

      - name: Install Python for ICO conversion
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install Pillow

      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y

      - name: Set version from input
        shell: bash
        run: mvn versions:set -DnewVersion=${VERSION} -q

      - name: Create app_icon.ico from PNG
        shell: python
        run: |
          from PIL import Image
          img = Image.open('app/src/main/resources/icons/app_icon.png')
          sizes = [(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)]
          icons = [img.resize(s, Image.LANCZOS) for s in sizes]
          icons[0].save('app/src/main/resources/icons/app_icon.ico', format='ICO', sizes=sizes)

      - name: Build fat jar + jlink runtime
        shell: bash
        run: |
          mvn package -DskipTests -pl launcher,app -am -P dist -q

          JAR=$(ls app/target/jlshell-app-*.jar | head -1)
          LAUNCHER_JAR=$(ls launcher/target/jlshell-launcher-*.jar | head -1)
          echo "JAR=$JAR" >> $GITHUB_ENV
          echo "LAUNCHER_JAR=$LAUNCHER_JAR" >> $GITHUB_ENV

          JDK=$JAVA_HOME
          rm -rf dist/runtime
          "$JDK/bin/jlink" \
            --module-path "$JDK/jmods" \
            --add-modules $MODULES \
            --output dist/runtime \
            --strip-debug --no-man-pages --no-header-files --compress zip-6

      - name: Package Windows app image and installer
        shell: bash
        run: |
          JDK=$JAVA_HOME
          PKG_VERSION="${VERSION#0.}"
          PKG_VERSION="1.${PKG_VERSION}"

          rm -rf dist/win-input dist/win-image dist/win-installer dist/win-jpackage-temp
          mkdir -p dist/win-input
          mkdir -p dist/win-input/app
          cp "$LAUNCHER_JAR" dist/win-input/jlshell-launcher.jar
          cp "$JAR" dist/win-input/app/jlshell-app-bundled.jar

          "$JDK/bin/jpackage" \
            --type app-image \
            --name JLShell \
            --app-version "$PKG_VERSION" \
            --input dist/win-input \
            --main-jar jlshell-launcher.jar \
            --main-class com.jlshell.launcher.BootstrapLauncher \
            --runtime-image dist/runtime \
            --icon app/src/main/resources/icons/app_icon.ico \
            --vendor JLShell \
            --description "JLShell SSH Client" \
            --java-options "-Xms64m" \
            --java-options "-Xmx512m" \
            --java-options "-XX:+ExplicitGCInvokesConcurrent" \
            --java-options "--add-opens java.base/java.lang=ALL-UNNAMED" \
            --java-options "--add-opens java.desktop/sun.awt=ALL-UNNAMED" \
            --dest dist/win-image

          # plugins directory — drop plugin JARs here to install them
          mkdir -p dist/win-image/JLShell/plugins
          cat > dist/win-image/JLShell/plugins/README.txt <<'EOF'
          Place plugin JAR files (*.jar) in this directory.
          JLShell will automatically discover and load them on startup.
          EOF

          cd dist/win-image && 7z a -tzip "../JLShell-${VERSION}-win-x64.zip" JLShell && cd ../..

          "$JDK/bin/jpackage" \
            --type msi \
            --name JLShell \
            --app-version "$PKG_VERSION" \
            --input dist/win-input \
            --main-jar jlshell-launcher.jar \
            --main-class com.jlshell.launcher.BootstrapLauncher \
            --runtime-image dist/runtime \
            --icon app/src/main/resources/icons/app_icon.ico \
            --vendor JLShell \
            --description "JLShell SSH Client" \
            --java-options "-Xms64m" \
            --java-options "-Xmx512m" \
            --java-options "-XX:+ExplicitGCInvokesConcurrent" \
            --java-options "--add-opens java.base/java.lang=ALL-UNNAMED" \
            --java-options "--add-opens java.desktop/sun.awt=ALL-UNNAMED" \
            --win-dir-chooser \
            --win-menu \
            --win-menu-group JLShell \
            --win-shortcut \
            --win-upgrade-uuid "e3c8f9a2-7b41-4d6e-a5f0-9c2e8d1b3f47" \
            --resource-dir app/src/main/resources/msi \
            --temp dist/win-jpackage-temp \
            --verbose \
            --dest dist/win-installer

          cp dist/win-installer/*.msi "dist/JLShell-${VERSION}-win-x64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: win-packages
          path: |
            dist/JLShell-${{ env.VERSION }}-win-x64.zip
            dist/JLShell-${{ env.VERSION }}-win-x64.msi

  # ── Create GitHub Release ────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-mac, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: JLShell v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/JLShell-${{ env.VERSION }}-mac.zip
            artifacts/JLShell-${{ env.VERSION }}-linux-x64.tar.gz
            artifacts/JLShell-${{ env.VERSION }}-linux-x64.deb
            artifacts/JLShell-${{ env.VERSION }}-linux-x86_64.AppImage
            artifacts/JLShell-${{ env.VERSION }}-win-x64.zip
            artifacts/JLShell-${{ env.VERSION }}-win-x64.msi
            artifacts/jlshell-app-${{ env.VERSION }}.jar
          body: |
            ## JLShell v${{ env.VERSION }}

            ### 下载

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | macOS | `JLShell-${{ env.VERSION }}-mac.zip` | 解压后双击 `JLShell.app` |
            | Linux | `JLShell-${{ env.VERSION }}-linux-x64.tar.gz` | 解压后运行 `./JLShell.sh` |
            | Linux | `JLShell-${{ env.VERSION }}-linux-x64.deb` | `sudo dpkg -i` 安装，命令行 `jlshell` |
            | Linux | `JLShell-${{ env.VERSION }}-linux-x86_64.AppImage` | `chmod +x` 后直接运行 |
            | Windows | `JLShell-${{ env.VERSION }}-win-x64.zip` | 解压后双击 `JLShell.exe` |
            | Windows | `JLShell-${{ env.VERSION }}-win-x64.msi` | 安装后可从开始菜单搜索 `JLShell` |
            | Incremental | `jlshell-app-${{ env.VERSION }}.jar` | 官网更新 API 使用的 jar 增量包 |

            > 所有包均内置精简 JRE，无需安装 JDK。

  # ── Upload assets to OSS and notify website ────────────────────────────────
  publish-oss:
    name: Upload OSS and Notify Website
    needs: [release]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.upload_to_oss == 'true' }}
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install OSS SDK
        run: python -m pip install --upgrade oss2

      - name: Upload release assets to Aliyun OSS
        id: oss_upload
        continue-on-error: true
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          JLSHELL_OSS_ENDPOINT: ${{ vars.JLSHELL_OSS_ENDPOINT }}
          JLSHELL_OSS_BUCKET: ${{ vars.JLSHELL_OSS_BUCKET }}
          JLSHELL_OSS_RELEASE_PREFIX: ${{ vars.JLSHELL_OSS_RELEASE_PREFIX }}
          JLSHELL_OSS_PUBLIC_BASE_URL: ${{ vars.JLSHELL_OSS_PUBLIC_BASE_URL }}
        run: |
          python <<'PY'
          import hashlib
          import json
          import mimetypes
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          import oss2

          version = os.environ["VERSION"]
          artifacts = Path("artifacts")
          endpoint = os.environ.get("JLSHELL_OSS_ENDPOINT") or "https://oss-cn-hangzhou.aliyuncs.com"
          bucket_name = os.environ.get("JLSHELL_OSS_BUCKET")
          access_key_id = os.environ.get("OSS_ACCESS_KEY_ID")
          access_key_secret = os.environ.get("OSS_ACCESS_KEY_SECRET")
          prefix = (os.environ.get("JLSHELL_OSS_RELEASE_PREFIX") or "releases").strip("/")
          public_base_url = (os.environ.get("JLSHELL_OSS_PUBLIC_BASE_URL") or "").rstrip("/")

          required = {
              "OSS_ACCESS_KEY_ID": access_key_id,
              "OSS_ACCESS_KEY_SECRET": access_key_secret,
              "JLSHELL_OSS_BUCKET": bucket_name,
          }
          missing = [key for key, value in required.items() if not value]
          if missing:
              raise SystemExit("Missing required GitHub Secrets/Variables: " + ", ".join(missing))

          if not public_base_url:
              parsed = urlparse(endpoint)
              scheme = parsed.scheme or "https"
              host = parsed.netloc or parsed.path
              public_base_url = f"{scheme}://{bucket_name}.{host}"

          auth = oss2.Auth(access_key_id, access_key_secret)
          bucket = oss2.Bucket(auth, endpoint, bucket_name)

          def asset(file_name, os_name, arch, package_type):
              path = artifacts / file_name
              if not path.is_file():
                  raise SystemExit(f"Missing release asset: {path}")
              return {
                  "path": path,
                  "fileName": file_name,
                  "os": os_name,
                  "arch": arch,
                  "packageType": package_type,
              }

          jar_name = f"jlshell-app-{version}.jar"
          requested_assets = [
              asset(jar_name, "windows", "any", "jar"),
              asset(jar_name, "linux", "any", "jar"),
              asset(jar_name, "mac", "any", "jar"),
              asset(f"JLShell-{version}-mac.zip", "mac", "any", "zip"),
              asset(f"JLShell-{version}-linux-x64.tar.gz", "linux", "x64", "tar.gz"),
              asset(f"JLShell-{version}-linux-x64.deb", "linux", "x64", "deb"),
              asset(f"JLShell-{version}-linux-x86_64.AppImage", "linux", "x64", "appimage"),
              asset(f"JLShell-{version}-win-x64.zip", "windows", "x64", "zip"),
              asset(f"JLShell-{version}-win-x64.msi", "windows", "x64", "msi"),
          ]

          content_types = {
              ".jar": "application/java-archive",
              ".zip": "application/zip",
              ".gz": "application/gzip",
              ".deb": "application/vnd.debian.binary-package",
              ".msi": "application/octet-stream",
              ".appimage": "application/octet-stream",
          }

          uploaded = {}
          payload_assets = []
          for item in requested_assets:
              file_name = item["fileName"]
              path = item["path"]
              object_key = f"{prefix}/{version}/{file_name}"
              if file_name not in uploaded:
                  suffix = "".join(path.suffixes).lower()
                  content_type = content_types.get(suffix) or content_types.get(path.suffix.lower())
                  if content_type is None:
                      content_type = mimetypes.guess_type(file_name)[0] or "application/octet-stream"
                  bucket.put_object_from_file(object_key, str(path), headers={"Content-Type": content_type})
                  sha256 = hashlib.sha256(path.read_bytes()).hexdigest()
                  size = path.stat().st_size
                  url = f"{public_base_url}/{object_key}"
                  uploaded[file_name] = {"url": url, "size": size, "sha256": sha256}

              metadata = uploaded[file_name]
              payload_assets.append({
                  "os": item["os"],
                  "arch": item["arch"],
                  "packageType": item["packageType"],
                  "fileName": file_name,
                  "downloadUrl": "",
                  "url": metadata["url"],
                  "size": metadata["size"],
                  "sha256": metadata["sha256"],
                  "visible": os.environ.get("RELEASE_ASSET_VISIBLE", "false").lower() == "true",
              })

          payload = {
              "version": version,
              "channel": os.environ.get("RELEASE_CHANNEL") or "stable",
              "updateType": "jar",
              "title": f"JLShell v{version}",
              "summary": f"Release generated by GitHub Actions run {os.environ.get('GITHUB_RUN_ID', '')}".strip(),
              "releaseNotes": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/releases/tag/v{version}",
              "mandatory": False,
              "requiresFullInstaller": False,
              "minLauncherVersion": "0.1.0",
              "publish": os.environ.get("RELEASE_PUBLISH", "false").lower() == "true",
              "assets": payload_assets,
          }
          Path("release-action-payload.json").write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          Path("oss-upload-manifest.json").write_text(
              json.dumps({"version": version, "objects": uploaded}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Uploaded {len(uploaded)} files to OSS and prepared {len(payload_assets)} website assets.")
          PY

      - name: Notify JLShell website
        id: website_notify
        if: ${{ github.event.inputs.notify_website == 'true' && steps.oss_upload.outcome == 'success' }}
        continue-on-error: true
        env:
          JLSHELL_SITE_URL: ${{ vars.JLSHELL_SITE_URL }}
          JLSHELL_ACTION_WEBHOOK_SECRET: ${{ secrets.JLSHELL_ACTION_WEBHOOK_SECRET }}
        run: |
          JLSHELL_SITE_URL="${JLSHELL_SITE_URL:-https://jlshell.oomn.net}"
          if [[ -z "$JLSHELL_ACTION_WEBHOOK_SECRET" ]]; then
            echo "Missing required GitHub secret: JLSHELL_ACTION_WEBHOOK_SECRET" >&2
            exit 1
          fi
          body="$(cat release-action-payload.json)"
          ts="$(date +%s)"
          sig="sha256=$(printf '%s.%s' "$ts" "$body" \
            | openssl dgst -sha256 -hmac "$JLSHELL_ACTION_WEBHOOK_SECRET" -hex \
            | awk '{print $2}')"
          curl -fS -X POST "${JLSHELL_SITE_URL%/}/api/v1/actions/releases" \
            -H "Content-Type: application/json" \
            -H "X-JLShell-Timestamp: $ts" \
            -H "X-JLShell-Signature: $sig" \
            --data "$body"

      - name: Report optional OSS publish result
        if: ${{ always() }}
        run: |
          if [[ "${{ steps.oss_upload.outcome }}" != "success" ]]; then
            echo "::warning::Optional OSS upload failed or was skipped. GitHub Release artifacts were already produced."
            exit 0
          fi
          if [[ "${{ github.event.inputs.notify_website }}" == "true" && "${{ steps.website_notify.outcome }}" != "success" ]]; then
            echo "::warning::Optional website notification failed or was skipped. OSS upload artifacts were already produced."
            exit 0
          fi
          echo "Optional OSS publish completed."

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.oss_upload.outcome == 'success' }}
        with:
          name: oss-upload-manifest
          path: |
            oss-upload-manifest.json
            release-action-payload.json
          if-no-files-found: warn
